name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    uses: ./.github/workflows/policy.yml
  docs-allowlist:
    uses: ./.github/workflows/docs-allowlist.yml
  pr-title:
    uses: ./.github/workflows/pr-title.yml
